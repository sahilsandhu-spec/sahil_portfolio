<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Generic BMS electronics board illustration</title>
  <desc id="desc">A public-safe illustration of a battery management system board with traces, chips, connectors, and signal nodes.</desc>
  <defs>
    <linearGradient id="bms-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#e1fff7"/>
    </linearGradient>
    <linearGradient id="bms-board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#123a6f"/>
    </linearGradient>
    <filter id="bms-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#073b5b" flood-opacity=".2"/>
    </filter>
  </defs>
